# Netlify builds the frontend only. The backend is a long-lived WebSocket
# server and lives on Colyseus Cloud; `shared/` is a library compiled into both.
#
# `base` is the directory Netlify runs the build in, but it still clones the
# whole repository - which matters here, because frontend/package.json depends
# on "@moonville/shared": "file:../shared". That path resolves only if the parent
# directory came along.

[build]
  base = "frontend"
  command = "npm run build"
  # Relative to `base`, so this is frontend/dist.
  publish = "dist"

[build.environment]
  # 22 is a floor, not a preference: @colyseus/shared-types declares
  # engines.node ">= 22.x", and Yarn 1 - which Netlify selects here because
  # frontend/yarn.lock exists - treats that as fatal rather than a warning.
  # Pinned so a change to Netlify's default image cannot move it.
  NODE_VERSION = "22"

  # Netlify fails a build when the value of an environment variable marked
  # "secret" turns up in the repo or the published files. That check stays on -
  # but nothing named VITE_* can be secret. Vite bakes those values into the
  # public bundle on purpose, because the browser needs them, so any VITE_ value
  # is readable by every visitor no matter how it is stored.
  #
  # Several were marked secret in the dashboard anyway, and Netlify does not let
  # that flag be removed once set. Their values are ordinary configuration -
  # "mainnet-beta", "100000", the backend's URL - that legitimately appear in
  # .env.example, in the source and in dist, so the build failed on every one.
  # Exempting them by name here is the fix that does not need the dashboard.
  #
  # Only VITE_* names are exempt. Anything genuinely secret (a service-role key,
  # SESSION_SECRET) has no business in this site's environment, and still fails
  # the build if it ever reaches the output, which is the point of the check.
  #
  # The last ten are no longer read by the code and are listed only until they
  # are deleted from the Netlify dashboard. A paid Solana RPC URL in
  # VITE_SOLANA_RPC would be public too - only use one locked to this domain.
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_URL,VITE_COLYSEUS_URL,VITE_X_URL,VITE_DEV_TOOLS,VITE_SOLANA_CLUSTER,VITE_SOLANA_RPC,VITE_SOLANA_EXPLORER,VITE_CITY_MIN_MOON_TRENCHES,VITE_CITY_MIN_MOON_BAGTOWN,VITE_CITY_MIN_MOON_MIDTOWN,VITE_CITY_MIN_MOON_UPTOWN,VITE_MOON_MINT,VITE_MOON_DEV_WALLET,VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_SENDER_ID,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_CHAIN_ID,VITE_CHAIN_NAME,VITE_CHAIN_RPC,VITE_CHAIN_EXPLORER,VITE_CITY_MIN_TRIBE_TRENCH,VITE_CITY_MIN_TRIBE_GAS,VITE_CITY_MIN_TRIBE_REALWORLD,VITE_CITY_MIN_TRIBE_VALHALLA"

  # The line above settles the check that compares against our env vars; it
  # reported zero. What fails the build is the other one - smart detection,
  # which matches values by shape regardless of where they came from, and an
  # "AIza..." string looks like a Google key whatever it is.
  #
  # Two different values were caught. Ours, in dist, which is a Firebase web
  # config and belongs in the bundle. And Firebase's own documentation
  # placeholder, AIzaSyDOCAbC123dEf456GhI789jKl012-MnO, sitting in comments
  # across eight .d.ts files in node_modules - a string that would fail this
  # build even if the project used no Firebase key at all.
  #
  # So node_modules comes out of the scan, since it is vendor code that is
  # never published, and our own key is named explicitly. Detection stays on
  # everywhere else, including over everything we actually deploy.
  #
  # Rotate the Firebase key and this line has to change with it.
  SECRETS_SCAN_OMIT_PATHS = "node_modules/**"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyBb-Na6s-wa4pUH8EySG3KVpN60LrOBwa0"

# React Router owns the URLs. Without this, every route except "/" is a request
# for a file that does not exist on disk - a visitor landing on /docs, or simply
# reloading the page while in the game, gets Netlify's 404 instead of the app.
# Must stay last: redirects are matched in order and this one matches everything.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
